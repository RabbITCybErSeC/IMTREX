# ARTEX Tencent TSec Benchmark evaluation image -- local one-shot build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # set LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in the foreground (watch the logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # in the background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to delete the volumes too)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host network: the container uses the host network stack directly and can
    # reach target networks on the host or over a VPN.
    # In host mode no port mapping is used; the container binds host ports directly: 8787 (UI/API),
    # 8788 (proxy) and the internal PostgreSQL 5432 -- make sure all three are free on the host
    # (stop whatever is using them before testing locally).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
